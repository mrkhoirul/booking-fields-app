services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingfields_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata

  app:
    build: .
    depends_on:
      - db
    environment:
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bookingfields_db
      JWT_SECRET: "zNVXH9K1ZUb+vGT6hTHz15YIVjSbUXEl88mZdfMlahI="
      JWT_EXPIRE_HOURS: "72"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123

    ports:
      - "8080:8080"
    command: ["./wait-for-postgresql.sh", "db", "./booking-fields-app"]

volumes:
  db-data:
